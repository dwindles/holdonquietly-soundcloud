# holdonquietly — host rewrites. Included by every location that filters bodies.
# Installed to /etc/nginx/snippets/hoq-rewrites.conf
#
# HOSTNAME -> HOSTNAME, never hostname -> host+path.
#
# The previous design mapped api-v2.soundcloud.com to <proxy>/__u/api-v2 and it
# could not work: the app assigns that value as a URL *hostname*, which silently
# drops the /__u/api-v2 path. Requests came out as https://<proxy>/me instead of
# https://<proxy>/__u/api-v2/me, hit the app location, and 404'd.
#
# Giving each upstream its own subdomain keeps paths byte-identical, so there is
# nothing to drop.
#
# NEVER add a bare 'soundcloud.com' or 'sndcdn.com' rule — both are substrings
# of every host below and would corrupt all of them.
#
# Adding a host: a line here, an entry in the $hoq_upstream map, a DNS name
# (covered by the wildcard), and a -d flag on the certificate.

sub_filter 'api-v2.soundcloud.com'    'api-v2.__PROXY_HOST__';
sub_filter 'api-auth.soundcloud.com'  'api-auth.__PROXY_HOST__';
sub_filter 'api.soundcloud.com'       'api.__PROXY_HOST__';
sub_filter 'graph.soundcloud.com'     'graph.__PROXY_HOST__';
sub_filter 'secure.soundcloud.com'    'secure.__PROXY_HOST__';

# The sign-in iframe loads its JS from secure.sndcdn.com — a DIFFERENT host
# from secure.soundcloud.com. Missing it meant the auth code ran un-rewritten
# and its API calls died cross-origin: "Something unexpected happened".
sub_filter 'secure.sndcdn.com'        'secure-cdn.__PROXY_HOST__';

# Waveform data. Our theme restyles the waveform, so without this the player
# draws nothing and the whole track page looks broken.
sub_filter 'wave.sndcdn.com'          'wave.__PROXY_HOST__';
# Realtime WebSocket (notifications, live counts).
sub_filter 'pushers.soundcloud.com'   'pushers.__PROXY_HOST__';

sub_filter 'a-v2.sndcdn.com'          'a-v2.__PROXY_HOST__';
sub_filter 'style.sndcdn.com'         'style.__PROXY_HOST__';
sub_filter 'va.sndcdn.com'            'va.__PROXY_HOST__';
sub_filter 'wis.sndcdn.com'           'wis.__PROXY_HOST__';
sub_filter 'i1.sndcdn.com'            'i1.__PROXY_HOST__';
sub_filter 'i2.sndcdn.com'            'i2.__PROXY_HOST__';
sub_filter 'i3.sndcdn.com'            'i3.__PROXY_HOST__';
sub_filter 'i4.sndcdn.com'            'i4.__PROXY_HOST__';
sub_filter 'cf-hls-media.sndcdn.com'  'hls.__PROXY_HOST__';
sub_filter 'hls-media.sndcdn.com'     'hls2.__PROXY_HOST__';
