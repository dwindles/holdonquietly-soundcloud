# holdonquietly — host rewrites, included by every location that filters bodies.
# Installed to /etc/nginx/snippets/hoq-rewrites.conf
#
# WHY BARE HOSTNAMES: earlier versions matched 'https://api-v2.soundcloud.com'
# and '"api-v2.soundcloud.com"' separately, and still missed the forms the JS
# bundles assemble at runtime — those calls went straight to SoundCloud and died
# on CORS. Matching the bare hostname covers every form at once, because
#   https://api-v2.soundcloud.com/me  ->  https://HOST/__u/api-v2/me
# is the same substitution as the quoted route-table entry.
#
# NEVER add a bare 'soundcloud.com' rule here — it is a substring of every host
# above and would corrupt all of them.
#
# Adding a host: add a sub_filter here AND a matching location in hoq-proxy.conf.

sub_filter 'api-v2.soundcloud.com'      '__PROXY_HOST__/__u/api-v2';
sub_filter 'api-auth.soundcloud.com'    '__PROXY_HOST__/__u/api-auth';
sub_filter 'graph.soundcloud.com'       '__PROXY_HOST__/__u/graph';
sub_filter 'secure.soundcloud.com'      '__PROXY_HOST__/__u/secure';

sub_filter 'a-v2.sndcdn.com'            '__PROXY_HOST__/__u/a-v2';
sub_filter 'style.sndcdn.com'           '__PROXY_HOST__/__u/style';
sub_filter 'va.sndcdn.com'              '__PROXY_HOST__/__u/va';
sub_filter 'wis.sndcdn.com'             '__PROXY_HOST__/__u/wis';
sub_filter 'i1.sndcdn.com'              '__PROXY_HOST__/__u/i1';
sub_filter 'i2.sndcdn.com'              '__PROXY_HOST__/__u/i2';
sub_filter 'i3.sndcdn.com'              '__PROXY_HOST__/__u/i3';
sub_filter 'i4.sndcdn.com'              '__PROXY_HOST__/__u/i4';
sub_filter 'cf-hls-media.sndcdn.com'    '__PROXY_HOST__/__u/hls';
sub_filter 'hls-media.sndcdn.com'       '__PROXY_HOST__/__u/hls';
