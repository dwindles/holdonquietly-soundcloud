# holdonquietly — SoundCloud reverse proxy with theme injection.
#
# WHY THIS EXISTS: on a phone where no extension can be installed and per-page
# injection (bookmarklet / Shortcut) is unworkable, the remaining way to get the
# theme onto the page is to serve the page yourself.
#
# THE UPSIDE: everything becomes same-origin. No CSP, no CORS, no canvas
# tainting on artwork, no mixed-content block on the friends backend. This build
# can do more than the userscript one, not less.
#
# THE DEAL: SoundCloud is a single-page app talking to several hosts. Each one
# is proxied under a /__u/ prefix here, and sub_filter rewrites the absolute
# URLs in the HTML/JS/JSON so the app reaches for the proxy instead of the
# original. When SoundCloud adds a host, playback or images break until it is
# added below. See proxy/README.md for how to find a missing one.
#
# SETUP: replace __PROXY_HOST__ everywhere with your hostname, e.g. sc.devuandoru.com
#   sed -i 's/__PROXY_HOST__/sc.devuandoru.com/g' hoq-proxy.conf
#
# REQUIRES the sub_filter module. Check with:  nginx -V 2>&1 | grep -o with-http_sub_module

# $connection_upgrade is not a built-in — nginx needs this map for WebSockets to
# survive the proxy. Must sit at http level, which is where this file is included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PROXY_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PROXY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PROXY_HOST__/privkey.pem;

    # Audio and artwork are large; do not buffer whole responses to disk.
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    client_max_body_size 64m;

    # Upstreams are HTTPS with SNI, and must not gzip: sub_filter can only
    # rewrite bodies it can read.
    #
    # TRAP: proxy_set_header does NOT merge across levels. Any location that
    # sets a header of its own discards ALL of these. That is why every such
    # location below repeats Accept-Encoding "" — without it the upstream
    # honours the browser's gzip and sub_filter silently rewrites nothing.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    sub_filter_once off;
    # text/html is always included implicitly — listing it warns about a
    # duplicate MIME type on every config test.
    sub_filter_types application/javascript text/javascript
                     application/json text/css application/x-mpegURL
                     application/vnd.apple.mpegurl;

    # ---- our own bits -------------------------------------------------------

    # The theme. Served from this host, so it is same-origin with the app.
    location = /hoq.js {
        alias /var/www/hoq/holdonquietly.proxy.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }

    # The friends backend runs on this same box, so this is a local hop — and
    # being same-origin is what makes it reachable at all (it is plain http,
    # which an https page cannot fetch directly).
    location /__hoq/friends {
        proxy_pass http://127.0.0.1:8790/friends;
        proxy_set_header Host 127.0.0.1;
    }

    # ---- proxied SoundCloud hosts ------------------------------------------
    # Each block strips its /__u/<name>/ prefix and forwards to the real host.

    location ^~ /__u/api-v2/ {
        proxy_pass https://api-v2.soundcloud.com/;
        proxy_set_header Host api-v2.soundcloud.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        sub_filter 'https://api-v2.soundcloud.com'  'https://__PROXY_HOST__/__u/api-v2';
        sub_filter 'https:\/\/api-v2.soundcloud.com' 'https:\/\/__PROXY_HOST__\/__u\/api-v2';
        sub_filter 'https://i1.sndcdn.com'  'https://__PROXY_HOST__/__u/i1';
        sub_filter 'https:\/\/i1.sndcdn.com' 'https:\/\/__PROXY_HOST__\/__u\/i1';
        sub_filter 'https://i2.sndcdn.com'  'https://__PROXY_HOST__/__u/i2';
        sub_filter 'https:\/\/i2.sndcdn.com' 'https:\/\/__PROXY_HOST__\/__u\/i2';
        sub_filter 'https://i3.sndcdn.com'  'https://__PROXY_HOST__/__u/i3';
        sub_filter 'https:\/\/i3.sndcdn.com' 'https:\/\/__PROXY_HOST__\/__u\/i3';
        sub_filter 'https://i4.sndcdn.com'  'https://__PROXY_HOST__/__u/i4';
        sub_filter 'https:\/\/i4.sndcdn.com' 'https:\/\/__PROXY_HOST__\/__u\/i4';
    }

    location ^~ /__u/graph/ {
        proxy_pass https://graph.soundcloud.com/;
        proxy_set_header Host graph.soundcloud.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
    }

    location ^~ /__u/secure/ {
        proxy_pass https://secure.soundcloud.com/;
        proxy_set_header Host secure.soundcloud.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
    }

    # JS + CSS bundles. These carry absolute URLs, so they get rewritten too.
    location ^~ /__u/a-v2/ {
        proxy_pass https://a-v2.sndcdn.com/;
        proxy_set_header Host a-v2.sndcdn.com;
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://api-v2.soundcloud.com'  'https://__PROXY_HOST__/__u/api-v2';
        sub_filter 'https:\/\/api-v2.soundcloud.com' 'https:\/\/__PROXY_HOST__\/__u\/api-v2';
        sub_filter 'https://graph.soundcloud.com'   'https://__PROXY_HOST__/__u/graph';
        sub_filter 'https://secure.soundcloud.com'  'https://__PROXY_HOST__/__u/secure';
        sub_filter 'https://a-v2.sndcdn.com'        'https://__PROXY_HOST__/__u/a-v2';
        sub_filter 'https://style.sndcdn.com'       'https://__PROXY_HOST__/__u/style';
        sub_filter 'https://va.sndcdn.com'          'https://__PROXY_HOST__/__u/va';
        sub_filter 'https://wis.sndcdn.com'         'https://__PROXY_HOST__/__u/wis';
        sub_filter '"api-v2.soundcloud.com"' '"__PROXY_HOST__/__u/api-v2"';
        sub_filter '"graph.soundcloud.com"'  '"__PROXY_HOST__/__u/graph"';
    }

    location ^~ /__u/style/ { proxy_pass https://style.sndcdn.com/; proxy_set_header Host style.sndcdn.com; proxy_set_header Accept-Encoding ""; }
    location ^~ /__u/va/    { proxy_pass https://va.sndcdn.com/;    proxy_set_header Host va.sndcdn.com; proxy_set_header Accept-Encoding ""; }
    location ^~ /__u/wis/   { proxy_pass https://wis.sndcdn.com/;   proxy_set_header Host wis.sndcdn.com; proxy_set_header Accept-Encoding ""; }

    # Artwork. Deliberately NOT rewritten (binary), just forwarded.
    location ^~ /__u/i1/ { proxy_pass https://i1.sndcdn.com/; proxy_set_header Host i1.sndcdn.com; sub_filter_types ""; }
    location ^~ /__u/i2/ { proxy_pass https://i2.sndcdn.com/; proxy_set_header Host i2.sndcdn.com; sub_filter_types ""; }
    location ^~ /__u/i3/ { proxy_pass https://i3.sndcdn.com/; proxy_set_header Host i3.sndcdn.com; sub_filter_types ""; }
    location ^~ /__u/i4/ { proxy_pass https://i4.sndcdn.com/; proxy_set_header Host i4.sndcdn.com; sub_filter_types ""; }

    # Audio. HLS playlists are text and DO carry absolute media URLs, so they
    # are rewritten; the segments themselves pass straight through.
    location ^~ /__u/hls/ {
        proxy_pass https://cf-hls-media.sndcdn.com/;
        proxy_set_header Host cf-hls-media.sndcdn.com;
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://cf-hls-media.sndcdn.com' 'https://__PROXY_HOST__/__u/hls';

        # The app builds API URLs from a route table of BARE hostnames —
        # {"host":"api-v2.soundcloud.com","path":"/tracks"} — which the
        # scheme-prefixed rules above never match. Rewriting the quoted host to
        # host+prefix works because the app concatenates https:// + host + path.
        sub_filter '"api-v2.soundcloud.com"' '"__PROXY_HOST__/__u/api-v2"';
        sub_filter '"graph.soundcloud.com"'  '"__PROXY_HOST__/__u/graph"';
    }

    # ---- the app itself -----------------------------------------------------

    location / {
        proxy_pass https://soundcloud.com;
        proxy_set_header Host soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Login depends on this: SoundCloud sets cookies for its own domain, and
        # the browser would drop them under ours without the rewrite.
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_redirect https://soundcloud.com https://__PROXY_HOST__;

        # It frames itself (x-frame-options: SAMEORIGIN); under our host that
        # header would block the webi V2 track iframe.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        sub_filter 'https://api-v2.soundcloud.com'  'https://__PROXY_HOST__/__u/api-v2';
        sub_filter 'https:\/\/api-v2.soundcloud.com' 'https:\/\/__PROXY_HOST__\/__u\/api-v2';
        sub_filter 'https://graph.soundcloud.com'   'https://__PROXY_HOST__/__u/graph';
        sub_filter 'https:\/\/graph.soundcloud.com'  'https:\/\/__PROXY_HOST__\/__u\/graph';
        sub_filter 'https://secure.soundcloud.com'  'https://__PROXY_HOST__/__u/secure';
        sub_filter 'https://a-v2.sndcdn.com'        'https://__PROXY_HOST__/__u/a-v2';
        sub_filter 'https:\/\/a-v2.sndcdn.com'       'https:\/\/__PROXY_HOST__\/__u\/a-v2';
        sub_filter 'https://style.sndcdn.com'       'https://__PROXY_HOST__/__u/style';
        sub_filter 'https://va.sndcdn.com'          'https://__PROXY_HOST__/__u/va';
        sub_filter 'https://wis.sndcdn.com'         'https://__PROXY_HOST__/__u/wis';
        sub_filter 'https://i1.sndcdn.com'          'https://__PROXY_HOST__/__u/i1';
        sub_filter 'https:\/\/i1.sndcdn.com'         'https:\/\/__PROXY_HOST__\/__u\/i1';
        sub_filter 'https://i2.sndcdn.com'          'https://__PROXY_HOST__/__u/i2';
        sub_filter 'https:\/\/i2.sndcdn.com'         'https:\/\/__PROXY_HOST__\/__u\/i2';
        sub_filter 'https://i3.sndcdn.com'          'https://__PROXY_HOST__/__u/i3';
        sub_filter 'https:\/\/i3.sndcdn.com'         'https:\/\/__PROXY_HOST__\/__u\/i3';
        sub_filter 'https://i4.sndcdn.com'          'https://__PROXY_HOST__/__u/i4';
        sub_filter 'https:\/\/i4.sndcdn.com'         'https:\/\/__PROXY_HOST__\/__u\/i4';
        sub_filter 'https://cf-hls-media.sndcdn.com' 'https://__PROXY_HOST__/__u/hls';

        # And finally: inject the theme. Last rule so it cannot be undone by the
        # rewrites above.
        sub_filter '</head>' '<script src="/hoq.js"></script></head>';
    }
}

# Redirect plain http, and let certbot renew.
server {
    listen 80;
    listen [::]:80;
    server_name __PROXY_HOST__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
