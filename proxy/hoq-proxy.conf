# holdonquietly — SoundCloud reverse proxy with theme injection.
#
# WHY THIS EXISTS: on a phone where no extension can be installed and per-page
# injection (bookmarklet / Shortcut) is unworkable, the remaining way to get the
# theme onto the page is to serve the page yourself.
#
# THE UPSIDE: everything becomes same-origin. No CSP, no CORS, no canvas
# tainting on artwork, no mixed-content block on the friends backend.
#
# SETUP: replace __PROXY_HOST__ in BOTH this file and hoq-rewrites.conf.
# REQUIRES: nginx -V 2>&1 | grep -o with-http_sub_module
#
# ---------------------------------------------------------------------------
# THREE TRAPS, each of which cost a debugging round against the live site:
#
#  1. proxy_set_header does NOT merge across levels. A location that sets any
#     header discards ALL server-level ones. Every location below therefore
#     restates Accept-Encoding "" — without it upstream gzips and sub_filter
#     silently rewrites nothing. This passes curl (which sends no
#     Accept-Encoding) and fails only in a real browser.
#
#  2. SoundCloud 307-redirects phone user-agents to m.soundcloud.com. We send a
#     desktop UA upstream so the phone stays on the real app — which also means
#     no "Request Desktop Website" step on the phone.
#
#  3. Its responses carry CSP / X-Frame-Options naming soundcloud.com, which
#     under our host blocks framing (the webi V2 track page is an iframe). Both
#     headers are hidden in every location, not just the app one.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PROXY_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PROXY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PROXY_HOST__/privkey.pem;

    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    set $hoq_ua "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36";

    sub_filter_once off;
    # text/html is implicit; listing it warns about a duplicate MIME type.
    sub_filter_types application/javascript text/javascript application/json
                     text/css application/x-mpegURL application/vnd.apple.mpegurl;

    # ---- our own bits -------------------------------------------------------

    location = /hoq.js {
        alias /var/www/hoq/holdonquietly.proxy.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }

    # Plain http backend on this same box — being same-origin is what makes it
    # reachable from an https page at all.
    location /__hoq/friends {
        proxy_pass http://127.0.0.1:8790/friends;
        proxy_set_header Host 127.0.0.1;
    }

    # ---- proxied SoundCloud hosts ------------------------------------------

    location ^~ /__u/api-v2/ {
        proxy_pass https://api-v2.soundcloud.com/;
        proxy_set_header Host api-v2.soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $scheme://$host always;
        add_header Access-Control-Allow-Credentials true always;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    location ^~ /__u/api-auth/ {
        proxy_pass https://api-auth.soundcloud.com/;
        proxy_set_header Host api-auth.soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $scheme://$host always;
        add_header Access-Control-Allow-Credentials true always;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    location ^~ /__u/graph/ {
        proxy_pass https://graph.soundcloud.com/;
        proxy_set_header Host graph.soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $scheme://$host always;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    location ^~ /__u/secure/ {
        proxy_pass https://secure.soundcloud.com/;
        proxy_set_header Host secure.soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    # JS + CSS bundles: these carry the hostnames the app builds requests from.
    location ^~ /__u/a-v2/ {
        proxy_pass https://a-v2.sndcdn.com/;
        proxy_set_header Host a-v2.sndcdn.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        # SoundCloud content-hashes these filenames and sends a far-future
        # Cache-Control. We serve REWRITTEN content under the same hash, so a
        # browser would pin our rewrite forever and never see a rule change —
        # exactly what left a stale bundle calling api-auth directly. Cap it.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    location ^~ /__u/style/ {
        proxy_pass https://style.sndcdn.com/;
        proxy_set_header Host style.sndcdn.com;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    location ^~ /__u/va/  { proxy_pass https://va.sndcdn.com/;  proxy_set_header Host va.sndcdn.com;  proxy_set_header Accept-Encoding ""; }
    location ^~ /__u/wis/ { proxy_pass https://wis.sndcdn.com/; proxy_set_header Host wis.sndcdn.com; proxy_set_header Accept-Encoding ""; }

    # Artwork: binary, so no body filtering. CORS added so the theme's canvas
    # sampler can read pixels without tainting.
    location ^~ /__u/i1/ { proxy_pass https://i1.sndcdn.com/; proxy_set_header Host i1.sndcdn.com; sub_filter_types ""; add_header Access-Control-Allow-Origin * always; }
    location ^~ /__u/i2/ { proxy_pass https://i2.sndcdn.com/; proxy_set_header Host i2.sndcdn.com; sub_filter_types ""; add_header Access-Control-Allow-Origin * always; }
    location ^~ /__u/i3/ { proxy_pass https://i3.sndcdn.com/; proxy_set_header Host i3.sndcdn.com; sub_filter_types ""; add_header Access-Control-Allow-Origin * always; }
    location ^~ /__u/i4/ { proxy_pass https://i4.sndcdn.com/; proxy_set_header Host i4.sndcdn.com; sub_filter_types ""; add_header Access-Control-Allow-Origin * always; }

    # Audio. HLS playlists are text and carry absolute media URLs.
    location ^~ /__u/hls/ {
        proxy_pass https://cf-hls-media.sndcdn.com/;
        proxy_set_header Host cf-hls-media.sndcdn.com;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/hoq-rewrites.conf;
    }

    # ---- the app itself -----------------------------------------------------

    location / {
        proxy_pass https://soundcloud.com;
        proxy_set_header Host soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Referer https://soundcloud.com/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_redirect https://soundcloud.com https://__PROXY_HOST__;
        proxy_redirect https://m.soundcloud.com https://__PROXY_HOST__;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        include /etc/nginx/snippets/hoq-rewrites.conf;

        # Last, so the rewrites above cannot disturb it.
        sub_filter '</head>' '<script src="/hoq.js"></script></head>';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PROXY_HOST__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
