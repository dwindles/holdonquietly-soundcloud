# holdonquietly — SoundCloud reverse proxy with theme injection.
#
# WHY: on a phone where no extension can be installed and per-page injection is
# unworkable, serving the page yourself is the remaining option. Everything then
# becomes same-origin — no CSP, no CORS, no canvas tainting on artwork, and the
# plain-http friends backend becomes reachable from an https page.
#
# SETUP: replace __PROXY_HOST__ in BOTH this file and hoq-rewrites.conf with the
# BASE host (e.g. sc.holdonquietly.com — no leading dot, no subdomain).
# REQUIRES: nginx -V 2>&1 | grep -o with-http_sub_module
#
# ---------------------------------------------------------------------------
# FOUR TRAPS, each of which cost a debugging round against the live site:
#
#  1. SUBDOMAIN PER UPSTREAM, never a path prefix. The app assigns a configured
#     host as a URL *hostname*, so <proxy>/__u/api-v2 silently loses its path and
#     requests come out as <proxy>/me. Subdomains keep paths byte-identical.
#
#  2. proxy_set_header does NOT merge across levels. A location that sets any
#     header discards ALL server-level ones — hence Accept-Encoding "" is
#     restated everywhere. Without it upstream gzips and sub_filter silently
#     rewrites nothing. This passes curl (which sends no Accept-Encoding) and
#     fails only in a real browser.
#
#  3. SoundCloud 307-redirects phone user-agents to m.soundcloud.com, so we send
#     a desktop UA upstream. That also removes the phone's "Request Desktop
#     Website" step entirely.
#
#  4. Its responses carry CSP / X-Frame-Options naming soundcloud.com, which
#     under our host blocks framing (the webi V2 track page is an iframe), and a
#     far-future Cache-Control that would pin our rewritten bundles forever.
#     Both are stripped.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Which real host each subdomain fronts. Add a host here, in hoq-rewrites.conf,
# and on the certificate.
map $host $hoq_upstream {
    default                        "";
    api-v2.__PROXY_HOST__          "api-v2.soundcloud.com";
    api-auth.__PROXY_HOST__        "api-auth.soundcloud.com";
    api.__PROXY_HOST__             "api.soundcloud.com";
    graph.__PROXY_HOST__           "graph.soundcloud.com";
    secure.__PROXY_HOST__          "secure.soundcloud.com";
    secure-cdn.__PROXY_HOST__      "secure.sndcdn.com";
    a-v2.__PROXY_HOST__            "a-v2.sndcdn.com";
    style.__PROXY_HOST__           "style.sndcdn.com";
    va.__PROXY_HOST__              "va.sndcdn.com";
    wis.__PROXY_HOST__             "wis.sndcdn.com";
    i1.__PROXY_HOST__              "i1.sndcdn.com";
    i2.__PROXY_HOST__              "i2.sndcdn.com";
    i3.__PROXY_HOST__              "i3.sndcdn.com";
    i4.__PROXY_HOST__              "i4.sndcdn.com";
    hls.__PROXY_HOST__             "cf-hls-media.sndcdn.com";
    hls2.__PROXY_HOST__            "hls-media.sndcdn.com";
}

# CORS origin to echo back. Hardcoding the base host broke sign-in: that iframe
# runs on secure.<host> and loads its scripts from secure-cdn.<host>, so an
# Access-Control-Allow-Origin naming only the base host was rejected and the
# modal rendered blank. Reflect any of our own origins instead — and it must be
# a real origin, not "*", because these requests carry credentials.
map $http_origin $hoq_cors_origin {
    default                                        "";
    "~^https://([a-z0-9-]+\.)?__PROXY_HOST_RE__$"  $http_origin;
}

# ===========================================================================
# 1. Every proxied upstream, on its own subdomain.
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^(api-v2|api-auth|api|graph|secure|secure-cdn|a-v2|style|va|wis|i1|i2|i3|i4|hls|hls2)\.__PROXY_HOST_RE__$";

    ssl_certificate     /etc/letsencrypt/live/__PROXY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PROXY_HOST__/privkey.pem;

    # proxy_pass with a variable needs a resolver.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    client_max_body_size 64m;

    set $hoq_ua "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36";

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript application/json
                     text/css application/x-mpegURL application/vnd.apple.mpegurl;

    location / {
        if ($hoq_upstream = "") { return 404; }

        proxy_pass https://$hoq_upstream$request_uri;
        proxy_set_header Host $hoq_upstream;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=300" always;

        # We rewrite bundles under SoundCloud's own content hashes, and the app
        # is same-origin-ish across these subdomains, so be permissive.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $hoq_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;

        # CORS preflight never reaches upstream.
        if ($request_method = OPTIONS) { return 204; }

        include /etc/nginx/snippets/hoq-rewrites.conf;
    }
}

# ===========================================================================
# 2. The app itself, on the base host. This one gets the theme injected.
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PROXY_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PROXY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PROXY_HOST__/privkey.pem;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    client_max_body_size 64m;

    set $hoq_ua "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36";

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript application/json
                     text/css application/x-mpegURL application/vnd.apple.mpegurl;

    location = /hoq.js {
        alias /var/www/hoq/holdonquietly.proxy.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }

    # Plain-http backend on this same box. Same-origin is what makes it
    # reachable from an https page at all.
    location /__hoq/friends {
        proxy_pass http://127.0.0.1:8790/friends;
        proxy_set_header Host 127.0.0.1;
    }

    location / {
        proxy_pass https://soundcloud.com;
        proxy_set_header Host soundcloud.com;
        proxy_set_header User-Agent $hoq_ua;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Referer https://soundcloud.com/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_domain soundcloud.com __PROXY_HOST__;
        proxy_cookie_domain .soundcloud.com __PROXY_HOST__;
        proxy_redirect https://soundcloud.com   https://__PROXY_HOST__;
        proxy_redirect https://m.soundcloud.com https://__PROXY_HOST__;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        include /etc/nginx/snippets/hoq-rewrites.conf;

        # Last, so the rewrites above cannot disturb it.
        sub_filter '</head>' '<script src="/hoq.js"></script></head>';
    }
}

# ===========================================================================
# 3. http -> https, and the ACME challenge for every name.
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __PROXY_HOST__ "~^.+\.__PROXY_HOST_RE__$";
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
